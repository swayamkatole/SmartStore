server.port=8080

# H2 in-memory database (no MySQL needed for dev)
spring.datasource.url=jdbc:h2:mem:smartstore;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Disable Redis for now (use simple cache)
spring.cache.type=simple

# JWT
jwt.secret=SmartStore_SuperSecret_Key_2024_MakeItLong_AtLeast256Bits!!
jwt.expiration=86400000

# JPA
spring.jpa.show-sql=false
